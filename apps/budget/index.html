:root[data-accent="plum"] { --brand: #6B3FA0; --brand-ink: #FFFFFF; --hero: #3F2466; --hero-2: #5A3590; }
:root[data-accent="rose"] { --brand: #B23A5E; --brand-ink: #FFFFFF; --hero: #6E2340; --hero-2: #93305A; }
:root[data-accent="sunset"] { --brand: #B9521B; --brand-ink: #FFFFFF; --hero: #7A3412; --hero-2: #A44A1C; }
:root[data-accent="graphite"] { --brand: #334155; --brand-ink: #FFFFFF; --hero: #1E2530; --hero-2: #2E3846; }
@media (prefers-color-scheme: dark) {
  :root[data-accent="ocean"]:not([data-theme="light"]) { --brand: #6AA8F0; --brand-ink: #0A1D33; --hero: #13304F; --hero-2: #1B4573 }
  :root[data-accent="plum"]:not([data-theme="light"]) { --brand: #B592F0; --brand-ink: #1E1036; --hero: #2E1E4A; --hero-2: #432C6B }
  :root[data-accent="rose"]:not([data-theme="light"]) { --brand: #F08AA8; --brand-ink: #3A0D1C; --hero: #4A1C2C; --hero-2: #6A2840 }
  :root[data-accent="sunset"]:not([data-theme="light"]) { --brand: #F3A266; --brand-ink: #3A1A06; --hero: #4A2412; --hero-2: #6A3418 }
  :root[data-accent="graphite"]:not([data-theme="light"]) { --brand: #A9B6C8; --brand-ink: #111720; --hero: #1C222B; --hero-2: #2A323E } }
:root[data-theme="dark"][data-accent="ocean"] { --brand: #6AA8F0; --brand-ink: #0A1D33; --hero: #13304F; --hero-2: #1B4573 }
:root[data-theme="dark"][data-accent="plum"] { --brand: #B592F0; --brand-ink: #1E1036; --hero: #2E1E4A; --hero-2: #432C6B }
:root[data-theme="dark"][data-accent="rose"] { --brand: #F08AA8; --brand-ink: #3A0D1C; --hero: #4A1C2C; --hero-2: #6A2840 }
:root[data-theme="dark"][data-accent="sunset"] { --brand: #F3A266; --brand-ink: #3A1A06; --hero: #4A2412; --hero-2: #6A3418 }
:root[data-theme="dark"][data-accent="graphite"] { --brand: #A9B6C8; --brand-ink: #111720; --hero: #1C222B; --hero-2: #2A323E }

/* Dynamic Type: on iPhone the page follows the phone's text size; sizes below are in rem. */
@supports (font: -apple-system-body) { html { font: -apple-system-body } }
html { -webkit-text-size-adjust: 100%; background-color: var(--bg) }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: .9375rem; line-height: 1.42; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; -webkit-tap-highlight-color: transparent }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
a { color: inherit; text-decoration: none }
:focus-visible { outline: 2.5px solid var(--brand); outline-offset: 2px; border-radius: 10px }
.num { font-variant-numeric: tabular-nums }
[hidden] { display: none !important }
.wrap { max-width: 1100px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap }
.press { transition: transform .35s cubic-bezier(.2,.9,.3,1), background-color .2s ease, opacity .2s; touch-action: manipulation }
.press:active { transform: scale(.97); transition-duration: .12s }

/* top bar: round Menu button, the paycheck switcher, the page name once you scroll */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); pointer-events: none }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: transparent; border-bottom: 1px solid transparent; transition: border-color .2s, background-color .2s }
.topbar.scrolled { border-bottom-color: var(--line); background: var(--bar-bg); -webkit-backdrop-filter: saturate(1.6) blur(18px); backdrop-filter: saturate(1.6) blur(18px) }
.topbar .wrap { display: flex; align-items: center; justify-content: center; min-height: 54px; position: relative; padding-left: max(64px, env(safe-area-inset-left, 0px)); padding-right: max(64px, env(safe-area-inset-right, 0px)) }
.menubtn { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: 50%; translate: 0 -50%; width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface); box-shadow: 0 1px 2px rgba(20,30,55,.08), 0 2px 8px rgba(20,30,55,.06); color: var(--ink); display: grid; place-items: center; padding: 0; transition: transform .3s cubic-bezier(.2,.9,.3,1) }
.menubtn svg { width: 20px; height: 20px; grid-area: 1 / 1 }
.menubtn .i-back, .menubtn.back .i-menu { display: none }
.menubtn.back .i-back { display: block }
@media (min-width: 1132px) { .menubtn { left: calc((100vw - 1100px) / 2 + 16px) } }
.bar-title { position: absolute; left: 50%; transform: translateX(-50%); font-weight: 600; font-size: 1rem; opacity: 0; transition: opacity .2s; pointer-events: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: calc(100vw - 150px) }
.topbar.titled .bar-title { opacity: 1 }
.pill { display: flex; align-items: center; background: var(--surface); border-radius: 999px; box-shadow: 0 1px 2px rgba(20,30,55,.08), 0 2px 8px rgba(20,30,55,.06); max-width: 100% }
.pill button { border: 0; background: transparent; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; color: var(--ink-2); flex: none }
.pill button:active { background: var(--surface-2) }
.pill .label { border: 0; background: transparent; padding: 3px 6px; text-align: center; font-weight: 600; font-size: .875rem; line-height: 1.2; min-width: min(150px, calc(100vw - 230px)); border-radius: 12px; white-space: nowrap; min-height: 42px }
.pill .label small { display: block; font-weight: 500; font-size: .6875rem; color: var(--brand); letter-spacing: 0 }

/* views */
main { padding-bottom: calc(var(--tabh) + env(safe-area-inset-bottom, 0px) + 40px) }
.view.enter-r, .view.enter-l { animation: viewIn .24s ease-out }
@keyframes viewIn { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
.lt { padding: 8px 2px 2px }
.lt small { display: block; font-size: .8125rem; font-weight: 500; color: var(--ink-3) }
.lt h1 { font-family: var(--f-display); font-weight: 700; font-size: 2.05rem; line-height: 1.12; margin: 2px 0 0; text-wrap: balance; color: var(--ink) }
.cols { display: grid; gap: 0 18px; grid-template-columns: minmax(0, 1fr) }
.col { min-width: 0 }
@media (min-width: 780px) { .cols { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start } .lt h1 { font-size: 2.3rem } }

/* grouped lists with hairline dividers */
.group { margin-top: 32px }
.group-h { display: flex; align-items: baseline; gap: 10px; padding: 0 4px 10px }
.group-h h2 { font-family: var(--f-display); font-weight: 700; font-size: 1.25rem; margin: 0; display: flex; align-items: center; gap: 8px; min-width: 0 }
.group-h h2 i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none }
.group-h .tot { margin-left: auto; text-align: right; font-weight: 600; font-size: .9375rem; white-space: nowrap }
.group-h .tot small { display: block; font-weight: 500; font-size: .75rem; color: var(--ink-3); letter-spacing: 0 }
.group-h a, .group-h .lnk { margin-left: auto; color: var(--brand); font-weight: 500; font-size: .9375rem; padding: 8px 2px; display: flex; align-items: center; gap: 2px; border: 0; background: transparent; white-space: nowrap }
.list { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); overflow: hidden }
.card { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 16px }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 56px; width: 100%; border: 0; background: transparent; text-align: left; position: relative; transition: background-color .2s }
.list > .li + .li::before, .list > .li + .lrow::before, .list > .lrow + .li::before, .list > .lrow + .lrow::before { content: ""; position: absolute; left: 58px; right: 0; top: 0; height: 1px; background: var(--line); transform: scaleY(.5); transform-origin: top }
button.li:active, a.li:active, .li-main:active { background: var(--surface-2) }
.lrow { display: flex; align-items: center; gap: 8px; padding-right: 12px; position: relative }
.li-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; padding: 11px 0 11px 16px; min-height: 58px; border: 0; background: transparent; text-align: left; border-radius: 0 }
.ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; font-weight: 700; font-size: .875rem }
.ic svg { width: 17px; height: 17px }
.tx { flex: 1; min-width: 0 }
.tx b { display: block; font-weight: 500; overflow-wrap: anywhere }
.tx small { display: block; color: var(--ink-3); font-size: .8125rem; margin-top: 1px; overflow-wrap: anywhere }
.amt { font-weight: 600; white-space: nowrap; text-align: right }
.amt small { display: block; font-weight: 500; font-size: .75rem; color: var(--ink-3) }
.chev { color: var(--ink-3); flex: none; width: 14px; height: 14px; opacity: .8 }
.li.dim .tx b, .li.dim .amt, .lrow.dim .tx b { color: var(--ink-3) }
.li.addrow { color: var(--brand); font-weight: 500; min-height: 52px }
.li.addrow .ic { background: transparent; color: var(--brand) }
.mini-track { height: 5px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 7px; display: block }
.mini-track > *, .track div { display: block; height: 100%; border-radius: 99px; width: 0; transition: width 1s cubic-bezier(.22,1,.36,1) }
.track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden }
.over-fill { background: repeating-linear-gradient(-45deg, var(--debt), var(--debt) 6px, color-mix(in srgb, var(--debt) 72%, var(--surface)) 6px 12px) !important }
.pilltag { font-size: .6875rem; font-weight: 600; padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex: none }
.pilltag.late { background: var(--debt-soft); color: var(--debt) } .pilltag.soon { background: var(--warn-soft); color: var(--warn) } .pilltag.ok { background: var(--ok-soft); color: var(--ok) } .pilltag.sub { background: var(--subs-soft); color: var(--subs) }
.chipbtn { border: 0; border-radius: 999px; padding: 8px 13px; font-weight: 600; font-size: .8125rem; min-height: 34px; white-space: nowrap; flex: none }
.chipbtn.save { background: var(--save-soft); color: var(--save) } .chipbtn.debt { background: var(--debt-soft); color: var(--debt) } .chipbtn.done { background: var(--ok-soft); color: var(--ok) }
.check { width: 44px; height: 44px; margin: -7px -6px -7px -8px; border: 0; background: transparent; display: grid; place-items: center; flex: none; padding: 0 }
.check span { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; transition: background .2s, border-color .2s; background: var(--surface) }
.check svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: .25s cubic-bezier(.3,1.6,.5,1); color: #fff }
.check.on span { background: var(--ok); border-color: var(--ok) }
.check.on svg { opacity: 1; transform: none }
.paid .tx b { text-decoration: line-through; text-decoration-color: var(--ink-3); color: var(--ink-2) }
.empty { text-align: center; padding: 18px 16px 16px; color: var(--ink-2); font-size: .875rem }
.empty svg { width: 96px; height: 64px; margin: 0 auto 6px; display: block }
.muted { color: var(--ink-3); font-size: .8125rem }
.note { padding: 8px 6px 0; color: var(--ink-3); font-size: .8125rem }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block }

/* home */
.sample-bar { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 10px 12px 10px 14px; font-weight: 500; font-size: .875rem; min-height: 44px }
.sample-bar span { flex: 1 }
.sample-bar b { font-weight: 700; margin-right: 4px }
.hero { margin-top: 16px; display: block; position: relative; overflow: hidden; border-radius: 22px; color: var(--hero-ink); background: radial-gradient(120% 130% at 100% 0%, var(--hero-2) 0%, var(--hero) 60%); padding: 20px; box-shadow: 0 8px 24px color-mix(in srgb, var(--hero) 28%, transparent) }
.hero .tex { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55 }
.hero .in { position: relative; z-index: 1; display: grid; gap: 16px }
.hero .lbl { font-weight: 600; font-size: .875rem; color: var(--hero-ink-2) }
.hero .big { font-family: var(--f-display); font-weight: 700; font-size: clamp(2.75rem, 13vw, 3.6rem); line-height: 1; margin: 8px 0 6px; color: var(--hero-num) }
.hero .sub { color: var(--hero-ink); opacity: .78; font-size: .875rem; max-width: 40ch }
.hero .sub b { font-weight: 600 }
.hero .stats { display: flex; align-items: center; gap: 16px; background: color-mix(in srgb, var(--hero-ink) 9%, transparent); border-radius: 16px; padding: 12px 14px }
.ring { width: 84px; height: 84px; position: relative; flex: none }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .trk { stroke: color-mix(in srgb, var(--hero-ink) 16%, transparent) }
.ring .bar { stroke: var(--hero-num); transition: stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1) }
.ring .bar.over { stroke: #FFB4A6 }
.ring .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1 }
.ring .mid b { font-family: var(--f-display); font-size: 1.2rem; font-weight: 700; }
.ring .mid small { font-size: .66rem; font-weight: 500; color: var(--hero-ink-2); margin-top: 3px }
.minis { display: grid; gap: 10px; flex: 1; min-width: 0 }
.mini small { display: block; font-size: .75rem; font-weight: 500; color: var(--hero-ink); opacity: .72 }
.mini b { font-family: var(--f-display); font-size: 1.25rem; font-weight: 700; }
.hero-go { justify-self: start; display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: .875rem; padding: 9px 12px 9px 14px; border-radius: 999px; background: color-mix(in srgb, var(--hero-ink) 16%, transparent); color: var(--hero-ink) }
.hero-go svg { width: 14px; height: 14px }
@media (min-width: 780px) { .hero { padding: 26px } .hero .in { grid-template-columns: 1.2fr 1fr; align-items: center } .hero-go { grid-column: 1 / -1 } }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 12px }
.tile { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 12px 13px; display: flex; flex-direction: column; gap: 2px; min-width: 0 }
.tile .th { display: flex; align-items: center; gap: 6px; font-weight: 600; font-size: .8125rem; margin-bottom: 8px; min-width: 0 }
.tile .th svg { width: 15px; height: 15px; flex: none }
.tile .th span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile small { color: var(--ink-3); font-size: .75rem; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.tile b { font-family: var(--f-display); font-weight: 700; font-size: 1.32rem; line-height: 1.1; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.backup-nudge { margin-top: 12px; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: start; gap: 12px; background: var(--surface); border-radius: var(--r-md); padding: 12px 4px 12px 14px; box-shadow: var(--shadow) }
.backup-nudge .ic { margin-top: 1px; background: var(--info-soft); color: var(--info) }
.backup-nudge .lnk { display: inline-block; margin-top: 6px; border: 0; background: transparent; padding: 0; color: var(--brand); font-weight: 600; font-size: .875rem }
.backup-nudge p { margin: 0; font-size: .8125rem; color: var(--ink-3); line-height: 1.35 }
.backup-nudge p b { color: var(--ink); display: block; font-size: .875rem; font-weight: 600 }
.backup-nudge .x { border: 0; background: transparent; color: var(--ink-3); width: 36px; height: 32px; margin-top: -6px; font-size: 1.25rem; line-height: 1; border-radius: 50% }

/* single rings, like the Fitness app */
.ringcard { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: 18px 8px 16px }
.rings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 4px; align-items: start }
@media (min-width: 560px) { .rings { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)) } }
.ringit { border: 0; background: transparent; padding: 0 4px; display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; color: var(--ink) }
.ringit .ringsvg { width: 84px; height: 84px; margin-bottom: 8px }
.ringit .rt { display: flex; flex-direction: column; align-items: inherit; min-width: 0; max-width: 100% }
.ringit .rt b { font-size: .8125rem; font-weight: 600; line-height: 1.25; max-width: 100%; overflow: hidden; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-wrap: balance }
.ringit .rt small { font-size: .75rem; color: var(--ink-3); line-height: 1.3; margin-top: 1px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.ringit .rt small.ok { color: var(--ok); font-weight: 600 }
.ringit .rt small.behind { color: var(--warn); font-weight: 600 }
.rings.n1, .rings.n2 { grid-template-columns: minmax(0, 1fr); gap: 16px }
.rings.n1 .ringit, .rings.n2 .ringit { flex-direction: row; align-items: center; text-align: left; gap: 16px; padding: 0 8px }
.rings.n1 .ringit .ringsvg, .rings.n2 .ringit .ringsvg { margin: 0; flex: none }
.rings.n1 .rt, .rings.n2 .rt { align-items: flex-start }
.ringsvg { position: relative; width: 96px; height: 96px; display: block }
.ringsvg svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ringsvg circle { fill: none; stroke-linecap: round }
.ringsvg .trk { stroke: var(--surface-2) }
.ringsvg .arc { stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset 1s cubic-bezier(.2,.8,.2,1) }
.ringsvg .mid { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; line-height: 1 }
.ringsvg .mid b { font-family: var(--f-display); font-weight: 700; font-size: 1.02rem; }
.ringsvg .mid small { display: block; font-size: .64rem; font-weight: 500; color: var(--ink-3); margin-top: 3px }

/* wallet cards for savings goals and debts */
.wcard { --c1: #1F4F86; --c2: #4A80C2; position: relative; isolation: isolate; display: flex; flex-direction: column; width: 100%; height: 11.2rem; text-align: left; border: 0; border-radius: 18px; padding: 15px 17px 14px; color: var(--wc-ink);
  background: radial-gradient(140% 120% at 100% 0%, var(--c2) 0%, var(--c1) 64%); box-shadow: inset 0 1px 0 rgba(255,255,255,.3), inset 0 0 0 1px rgba(255,255,255,.1), 0 6px 14px color-mix(in srgb, var(--c1) 26%, transparent), 0 1px 2px rgba(0,0,0,.14); overflow: hidden; transition: transform .2s cubic-bezier(.2,.8,.2,1) }
.wcard::before { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,.14) 0, rgba(255,255,255,.03) 3rem, transparent 3.2rem); pointer-events: none }
.wcard::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(90% 60% at 0% 100%, rgba(0,0,0,.14), transparent 70%); pointer-events: none }
.wcard.g1 { --c1: #285C3B; --c2: #4F8A65 }
.wcard.g2 { --c1: #42307F; --c2: #7A5BC7 }
.wcard.g3 { --c1: #7E2848; --c2: #B5527A }
.wcard.debt { --c1: #4A2530; --c2: #8E4458 }
.wcard .w1 { display: flex; align-items: center; gap: 8px; min-width: 0; position: relative; z-index: 1 }
.wcard .w1 small { flex: 1; min-width: 0; font-weight: 600; font-size: .6875rem; letter-spacing: .06em; text-transform: uppercase; color: var(--wc-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.wcard .w2 { display: flex; align-items: flex-start; gap: 10px; margin-top: 3px; position: relative; z-index: 1 }
.wcard .w2 b { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.14rem; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden }
.wcard .w2 span { font-weight: 600; font-size: .9375rem; white-space: nowrap; color: var(--wc-ink); font-variant-numeric: tabular-nums }
.wcard .wbar { position: relative; z-index: 1; display: block; height: 5px; border-radius: 99px; background: rgba(255,255,255,.2); overflow: hidden; margin-top: auto }
.wcard .wbar span { display: block; height: 100%; width: 0; border-radius: 99px; background: rgba(255,255,255,.92); transition: width 1s cubic-bezier(.22,1,.36,1) }
.wcard .w3 { margin-top: 10px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; position: relative; z-index: 1 }
.wcard .w3 .no { font-variant-numeric: tabular-nums; font-size: .8125rem; font-weight: 500; color: var(--wc-ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0 }
.wcard .w3 .no b { color: var(--wc-ink); font-weight: 600 }
.wcard .w3 .ex { text-align: right; white-space: nowrap }
.wcard .w3 .ex small { display: block; font-size: .64rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--wc-ink-2) }
.wcard .w3 .ex b { font-size: .9375rem; font-weight: 600; font-variant-numeric: tabular-nums }

/* bars, rings and donuts grow in once they're on screen (hidden tabs wait until they open) */
function fillIn(scope) {

  scope.querySelectorAll("[data-w]").forEach(el => { if (vis(el)) el.style.width = el.dataset.w; });
  scope.querySelectorAll("[data-off]").forEach(el => { if (vis(el)) el.style.strokeDashoffset = el.dataset.off; });
  scope.querySelectorAll("[data-dash]").forEach(el => { if (vis(el)) el.style.strokeDasharray = el.dataset.dash; });
  scope.querySelectorAll("[data-arc]").forEach(el => { if (vis(el)) el.style.strokeDashoffset = 100 - (+el.dataset.arc); });

/* count-up: numbers roll from their last shown value; a view's numbers roll the first time it opens */
function countAll(scope) {

    if (el.closest("[hidden]")) return;

    const t0 = performance.now(), dur = 650;

}

/* one ring like the Fitness app: what's spent in the middle, the name and one plain status line under it */

/* savings goals and debts as cards in a wallet */
function goalCard(g) {

function monthItems(y, m) {
  const items = S.bills.filter(b => dueIn(b, y, m)).map(b => { const dt = dueOn(b, y, m); return { type: "bill", b: { ...b, date: dt, key: keyOf(b, dt) }, date: dt }; });

/* ---------- files: save one on the phone (Files, share sheet or a download) ---------- */
async function saveFile(name, data, mime, title) {
  try {
    if (downloads) { await downloads.save({ filename: name, data }); return true; }
    const blob = new Blob([data], { type: mime });
    const file = typeof File === "function" ? new File([blob], name, { type: mime }) : null;
    if (file && /iP(hone|ad|od)|Android/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return true; }
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); return true;
  } catch (e) {
    if (e && (e.code === "declined" || e.name === "AbortError")) toast("Canceled");
    else if (e && e.code === "rejected_extension") toast("This file can't be saved here. Open the app from your Home Screen.");
    else toast("Couldn't save the file here");
    return false;
  }
}

function onScroll() {

  const hf = h1 ? Math.max(0, Math.min(1, (h1.getBoundingClientRect().top - bb + 12) / 14)) : 1;
  bar.classList.toggle("titled", !!h1 && hf < .05);
