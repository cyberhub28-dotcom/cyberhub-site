// - Later opens: checks the key is still good (refunds turn it off).

async function unlock({ server, templateId, typedKey, storage = globalThis.localStorage, win = globalThis.window, fetchFn = globalThis.fetch }) {

  if (isIosSafariTab(win)) {

    if (verified.ok) return { state: 'add_to_home_screen' };

    if (fromLink) clearKeyFromAddressBar(win);

  }

  if (result.offline && saved.key === key && saved.activated && withinGrace(saved.lastOk)) {
    return { state: 'unlocked', offline: true };

  if (!result.offline && ['disabled', 'invalid_key', 'not_activated'].includes(result.error)) {

function lockedFrom(result) {
  if (result.offline) return { state: 'locked', reason: 'offline' };

async function call(fetchFn, server, action, body) {
  try {
    const res = await fetchFn(`${server.replace(/\/+$/, '')}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

function cleanKey(value) {

function keyFromLink(win) {
  if (!win || !win.location) return null;
  const params = new URLSearchParams(String(win.location.hash || '').replace(/^#/, ''));
  return params.get('key');

function clearKeyFromAddressBar(win) {
  try {
    win.history.replaceState(null, '', win.location.pathname + win.location.search);
  } catch {
    // Not important if this fails.
  }

function isIosSafariTab(win) {
  if (!win || !win.navigator) return false;
  const ua = win.navigator.userAgent || '';
  const isIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && win.navigator.maxTouchPoints > 1);

function newDeviceToken() {
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

function withinGrace(lastOk) {
  return typeof lastOk === 'number' && Date.now() - lastOk < OFFLINE_GRACE_DAYS * 24 * 60 * 60 * 1000;

function read(storage, templateId) {
  try {
    return JSON.parse(storage.getItem(STORE_PREFIX + templateId) || '{}');
  } catch {
    return {};
  }
}

function write(storage, templateId, value) {
  try {
    storage.setItem(STORE_PREFIX + templateId, JSON.stringify(value));
  } catch {
    // Storage can be full or blocked; the app still works this session.
  }
}

const SUPPORT = 'support@cyberhubsoftware.com';

function messageFor(reason, appName) {
  switch (reason) {
    case 'no_key':
      return { title: `Unlock ${appName}`, body: 'Open the personal link from your purchase email, or paste your purchase key below.', askKey: true };
    case 'invalid_key':
      return { title: 'That key didn\'t work', body: `Check the key in your purchase email for ${appName} and try again.`, askKey: true };
    case 'device_limit':
      return { title: 'Already on 3 devices', body: `This key is in use on 3 devices, the most it allows. Need help? Email ${SUPPORT}.`, askKey: false };
    case 'disabled':
      return { title: 'This key is switched off', body: `This purchase was refunded or cancelled, so the key no longer works. Questions? Email ${SUPPORT}.`, askKey: true };
    case 'suspended':
      return { title: 'This key is on hold', body: `There's an open payment question on this purchase. Email ${SUPPORT} and we'll help.`, askKey: false };
    case 'offline':
      return { title: 'You\'re offline', body: 'Connect to the internet once to unlock. After that the app works offline too.', askKey: false, retry: true };
    case 'too_many_tries':
      return { title: 'Too many tries', body: 'Please wait a minute, then try again.', askKey: false, retry: true };
    case 'add_to_home_screen':
      return { title: 'One more step', body: `Your key works! Tap the Share button, then "Add to Home Screen". Then open ${appName} from your Home Screen. If it asks for your key, paste it there.`, askKey: false };
    default:
      return { title: 'Something went wrong', body: `Please try again. If it keeps happening, email ${SUPPORT}.`, askKey: false, retry: true };
  }

function startLock({ server, templateId, appName, shopUrl, initialKey, doc = globalThis.document }) {

    const $ = (id) => root.getElementById(id);

    if (shopUrl) $('s').href = shopUrl;

    const show = (reason) => {

      $('b').textContent = m.body;
