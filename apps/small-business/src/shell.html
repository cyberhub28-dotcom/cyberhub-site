  var host = String(location.hostname || '');

// CyberHub purchase-key check for mini apps. Drop this file into a mini app
// and call unlock() when the app opens:
//
//   import { unlock } from './cyberhub-key.js';
//   const result = await unlock({ server: 'https://keys.example.com', templateId: 'budget' });
//   if (result.state === 'unlocked') startApp();
//   else showLockScreen(result);   // result.reason says why
//
// What it does:
// - First open from the buyer's link (…/#key=CH-XXXX-…): reads the key, makes
//   a random device token, and activates this device (max 3 per key).
// - Later opens: checks the key is still good (refunds turn it off).
// - Offline: keeps working for up to OFFLINE_GRACE_DAYS since the last good check.
// - iPhone Safari tab: only checks the key and asks the buyer to Add to Home
//   Screen first. The Home Screen app keeps its own storage, so activating in
//   the Safari tab would waste one of the 3 device slots.
//
// Only the key, a random device token and the last check date are saved on
// the device. Nothing the buyer types into the app is sent anywhere.

const OFFLINE_GRACE_DAYS = 14;
const STORE_PREFIX = 'cyberhub-key:';

// typedKey is a key the buyer typed or pasted on the lock screen.
async function unlock({ server, templateId, typedKey, storage = globalThis.localStorage, win = globalThis.window, fetchFn = globalThis.fetch }) {
  const saved = read(storage, templateId);
  const fromLink = keyFromLink(win);
  const key = cleanKey(typedKey) || fromLink || saved.key;
  if (!key) return { state: 'locked', reason: 'no_key' };

  if (isIosSafariTab(win)) {
    const verified = await call(fetchFn, server, 'verify', { key, template_id: templateId });
    if (verified.ok) return { state: 'add_to_home_screen' };
    return lockedFrom(verified);
  }

  const deviceToken = saved.deviceToken || newDeviceToken();
  const firstTime = !saved.key || saved.key !== key || !saved.activated;
  const action = firstTime ? 'activate' : 'check';
  const result = await call(fetchFn, server, action, { key, template_id: templateId, device_token: deviceToken });

  if (result.ok) {
    write(storage, templateId, { key, deviceToken, activated: true, lastOk: Date.now() });
    if (fromLink) clearKeyFromAddressBar(win);
    return { state: 'unlocked' };
  }

  if (result.offline && saved.key === key && saved.activated && withinGrace(saved.lastOk)) {
    return { state: 'unlocked', offline: true };
  }

  if (!result.offline && ['disabled', 'invalid_key', 'not_activated'].includes(result.error)) {
    // Keep the device token so a fixed key can reuse this device's slot.
    write(storage, templateId, { deviceToken, activated: false });
  }
  return lockedFrom(result);
}

function lockedFrom(result) {
  if (result.offline) return { state: 'locked', reason: 'offline' };
  return { state: 'locked', reason: result.error || 'unknown' };
}

async function call(fetchFn, server, action, body) {
  try {
    const res = await fetchFn(`${server.replace(/\/+$/, '')}/${action}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.status >= 500) return { ok: false, offline: true };
    return await res.json();
  } catch {
    return { ok: false, offline: true };
  }
}

function cleanKey(value) {
  return typeof value === 'string' && value.trim() ? value.trim() : null;
}

function keyFromLink(win) {
  if (!win || !win.location) return null;
  const params = new URLSearchParams(String(win.location.hash || '').replace(/^#/, ''));
  return params.get('key');
}

function clearKeyFromAddressBar(win) {
  try {
    win.history.replaceState(null, '', win.location.pathname + win.location.search);
  } catch {
    // Not important if this fails.
  }
}

function isIosSafariTab(win) {
  if (!win || !win.navigator) return false;
  const ua = win.navigator.userAgent || '';
  const isIos = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && win.navigator.maxTouchPoints > 1);
  const standalone = win.navigator.standalone === true
    || (typeof win.matchMedia === 'function' && win.matchMedia('(display-mode: standalone)').matches);
  return isIos && !standalone;
}

function newDeviceToken() {
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}

function withinGrace(lastOk) {
  return typeof lastOk === 'number' && Date.now() - lastOk < OFFLINE_GRACE_DAYS * 24 * 60 * 60 * 1000;
}

function read(storage, templateId) {
  try {
    return JSON.parse(storage.getItem(STORE_PREFIX + templateId) || '{}');
  } catch {
    return {};
  }
}

function write(storage, templateId, value) {
  try {
    storage.setItem(STORE_PREFIX + templateId, JSON.stringify(value));
  } catch {
    // Storage can be full or blocked; the app still works this session.
  }
}

// Lock screen for CyberHub mini apps. Covers the app until its key checks out.
//
//   import { startLock } from './cyberhub-lock.js';
//   await startLock({
//     server: 'https://keys.cyberhubsoftware.com',
//     templateId: 'budget',

//     initialKey,   // optional: a key read from the link before the app loaded
//   });
//   // ...the app is unlocked from here on.
//
// Buyer data never leaves the device. The lock only decides whether the app
// shows. A tech-savvy person could get around it; it stops casual sharing,
// it isn't copy-proof.


const SUPPORT = 'support@cyberhubsoftware.com';

function messageFor(reason, appName) {
  switch (reason) {
    case 'no_key':
      return { title: `Unlock ${appName}`, body: 'Open the personal link from your purchase email, or paste your purchase key below.', askKey: true };
    case 'invalid_key':
      return { title: 'That key didn\'t work', body: `Check the key in your purchase email for ${appName} and try again.`, askKey: true };
    case 'device_limit':
      return { title: 'Already on 3 devices', body: `This key is in use on 3 devices, the most it allows. Need help? Email ${SUPPORT}.`, askKey: false };
    case 'disabled':
      return { title: 'This key is switched off', body: `This purchase was refunded or cancelled, so the key no longer works. Questions? Email ${SUPPORT}.`, askKey: true };
    case 'suspended':
      return { title: 'This key is on hold', body: `There's an open payment question on this purchase. Email ${SUPPORT} and we'll help.`, askKey: false };
    case 'offline':
      return { title: 'You\'re offline', body: 'Connect to the internet once to unlock. After that the app works offline too.', askKey: false, retry: true };
    case 'too_many_tries':
      return { title: 'Too many tries', body: 'Please wait a minute, then try again.', askKey: false, retry: true };
    case 'add_to_home_screen':
      return { title: 'One more step', body: `Your key works! Tap the Share button, then "Add to Home Screen". Then open ${appName} from your Home Screen. If it asks for your key, paste it there.`, askKey: false };
    default:
      return { title: 'Something went wrong', body: `Please try again. If it keeps happening, email ${SUPPORT}.`, askKey: false, retry: true };
  }
}

function startLock({ server, templateId, appName, shopUrl, initialKey, doc = globalThis.document }) {
  return new Promise((resolve) => {
    const host = doc.createElement('div');
    host.setAttribute('data-cyberhub-lock', '');

    root.innerHTML = `<style>${STYLES}</style>
      <div class="scrim" role="dialog" aria-modal="true" aria-labelledby="t">
        <div class="card">
          <div class="icon" aria-hidden="true"></div>
          <h1 id="t"></h1>
          <p id="b"></p>
          <form id="f" hidden>
            <label for="k" class="sr">Purchase key</label>
            <input id="k" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="CH-XXXX-XXXX-XXXX-XXXX">
            <button type="submit" class="primary">Unlock</button>
          </form>
          <button id="r" class="primary" hidden>Try again</button>
          <a id="s" class="link" hidden></a>
        </div>
      </div>`;
    doc.body.appendChild(host);

    const $ = (id) => root.getElementById(id);
    $('s').textContent = `Get ${appName}`;
    if (shopUrl) $('s').href = shopUrl;

    const show = (reason) => {
      const m = messageFor(reason, appName);
      // textContent only: nothing typed or returned is ever run as code.
      $('t').textContent = m.title;
      $('b').textContent = m.body;
      $('f').hidden = !m.askKey;
      $('r').hidden = !m.retry;
      $('s').hidden = !(m.askKey && shopUrl);
    };

    // Remembers the last key given, so Try again re-checks that same key.
    let lastKey = null;
    const attempt = async (typedKey) => {
      if (typedKey) lastKey = typedKey;
      $('t').textContent = 'Checking your key…';
      $('b').textContent = '';
      $('f').hidden = true;
      $('r').hidden = true;
      $('s').hidden = true;
      const result = await unlock({ server, templateId, typedKey: lastKey });
      if (result.state === 'unlocked') {
        host.remove();
        resolve(result);
        return;
      }
      show(result.state === 'add_to_home_screen' ? 'add_to_home_screen' : result.reason);
    };

    $('f').addEventListener('submit', (e) => {
      e.preventDefault();
      attempt($('k').value);
    });
    $('r').addEventListener('click', () => attempt());
    attempt(initialKey);
  });
}
